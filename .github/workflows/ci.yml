name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Match the pnpm major that consumers actually run. This is not cosmetic:
      # the way pnpm prepares a git-hosted dependency (nested install, build-script
      # allowlisting) changed between 10 and 11, and that mechanism is exactly
      # where this package's release breakages have lived.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

      # Guard the class of bug that made three consecutive tags unusable: server
      # code reaching for something that only resolves inside a SvelteKit/Vite
      # build. Consumers import `symbiont-cms/server` from plain Node.
      - name: No framework-only imports in library code
        run: |
          set -euo pipefail
          if grep -rnE "^\s*import .*from '(\\\$env|\\\$app|@sveltejs/kit)" src/lib --include='*.ts'; then
            echo "::error::src/lib imports a SvelteKit-only module. These are Vite virtual"
            echo "::error::modules (or an undeclared dependency) and fail outside a SvelteKit"
            echo "::error::build, breaking 'import symbiont-cms/server' from Node."
            exit 1
          fi
          echo "ok: no SvelteKit-only imports in src/lib"

      # An env read at module scope throws on IMPORT, not on use. Because
      # server.ts re-exports webhook.js, a module-level requireEnvVar() made
      # CRON_SECRET mandatory just to call renderMarkdownToHtml().
      - name: No module-scope env reads that throw
        run: |
          set -euo pipefail
          if grep -rnE "^const .*requireEnvVar\(" src/lib --include='*.ts'; then
            echo "::error::requireEnvVar() at module scope throws during import."
            echo "::error::Move it inside the handler that needs the variable."
            exit 1
          fi
          echo "ok: no module-scope requireEnvVar"

      # The decisive one: can a bare Node project actually load this?
      # Static analysis cannot catch everything here -- pino-pretty was referenced
      # as a transport *target string*, not an import, so no grep would find it.
      # Only loading the built output does.
      #
      # This installs a PACKED TARBALL into a project of a different name, rather
      # than copying dist/ + package.json into a temp dir and installing that.
      # Two reasons, and the first is the one that matters:
      #
      #   - Installing the tarball means npm installs symbiont-cms's
      #     `dependencies` and nothing else, because devDependencies of a
      #     dependency are never installed. That is a stronger guarantee than
      #     `--omit=dev` on a root package, which only approximates it.
      #   - `npm pack` honours the `files` field, so the probe receives exactly
      #     what a consumer receives -- including the possibility that `files`
      #     omits something the package needs.
      #
      # The old shape made the probe project *be* symbiont-cms and relied on
      # Node's self-referencing resolution. It also made npm's tree builder crash
      # outright ("Cannot read properties of null (reading 'edgesOut')"), which
      # is a bug in npm rather than in this package -- but a check that cannot
      # run is not a check.
      - name: Built package imports from plain Node
        run: |
          set -euo pipefail
          tarball="$(pwd)/$(npm pack --silent | tail -n 1)"
          echo "packed: ${tarball}"

          probe="$(mktemp -d)"
          cd "$probe"
          cat > package.json <<EOF
          {
            "name": "symbiont-import-probe",
            "private": true,
            "type": "module",
            "dependencies": { "symbiont-cms": "file:${tarball}" }
          }
          EOF

          npm install --no-audit --no-fund --loglevel=error

          node --input-type=module -e "
            const m = await import('symbiont-cms/server');
            const required = ['createSymbiontClient','handlePollBlogRequest','renderMarkdownToHtml'];
            const missing = required.filter((k) => typeof m[k] !== 'function');
            if (missing.length) { console.error('missing exports:', missing.join(', ')); process.exit(1); }
            console.log('ok: symbiont-cms/server loaded,', Object.keys(m).length, 'exports');
          "
